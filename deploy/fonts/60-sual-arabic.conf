<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  خطوط ويندوز التي يختارها المدرس في القالب غير موجودة على خادم لينكس.
  هذه القواعد تجعل كل اسم منها يُرسم بخط مجاني مشابه، فيخرج PDF بالشكل نفسه،
  بينما يبقى الاسم الأصلي في ملف Word فيفتحه المدرس على ويندوز بخطه الحقيقي.
  الحزم المطلوبة (Ubuntu): fonts-hosny-amiri fonts-noto-core fonts-liberation2
  التثبيت: /etc/fonts/conf.d/60-sual-arabic.conf ثم fc-cache -f
-->
<fontconfig>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>IBM Plex Sans Arabic</family><prefer><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family><family>Noto Naskh Arabic</family></prefer></alias>
</fontconfig>
